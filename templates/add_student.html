{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="fas fa-user-plus"></i> Add New Student</h2>
    <p>Register a new student in the system</p>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Matric Number</label>
                            <input type="text" class="form-control" name="matric_no" placeholder="e.g., STU/2023/001" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="name" placeholder="e.g., John Doe" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" name="department" placeholder="e.g., Computer Science" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Level</label>
                            <select class="form-select" name="level" required>
                                <option value="">Select level...</option>
                                <option value="100">100 Level</option>
                                <option value="200">200 Level</option>
                                <option value="300">300 Level</option>
                                <option value="400">400 Level</option>
                            </select>
                        </div>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Attendance (%)</label>
                            <input type="number" class="form-control" name="attendance" min="0" max="100" step="0.01" placeholder="0-100" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">CA Score</label>
                            <input type="number" class="form-control" name="ca_score" min="0" max="100" step="0.01" placeholder="0-100" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Exam Score</label>
                            <input type="number" class="form-control" name="exam_score" min="0" max="100" step="0.01" placeholder="0-100" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Enter student login password" required>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Add Student</button>
                        <a href="{{ url_for('view_students') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
